# flake8 cannot be configured using pyproject.toml
[flake8]
show-source = True
max-line-length = 119
select = C,E,F,W,B
ignore = E501,E203
exclude=.venv,.git,dist,doc,*lib/python*,*egg,build,httpstan/include

[mypy]
ignore_missing_imports = True
disallow_untyped_defs = True
exclude=httpstan/include

# doc/conf.py is Sphinx configuration, not part of the package; it is pulled in
# via `from doc.conf import version` in httpstan/openapi.py. Don't type-check.
[mypy-doc.conf]
ignore_errors = True
